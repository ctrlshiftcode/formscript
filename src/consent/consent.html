<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Save form - FormScript</title>
    <link rel="stylesheet" href="consent.css">
  </head>
  <body>
    <main aria-label="Confirm form storage">
      <div class="actions">
        <button id="confirm" class="primary" type="button">OK</button>
        <button id="cancel" class="cancel" type="button">Cancelar</button>
      </div>
      <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
    </main>
    <script src="consent.js"></script>
  </body>
</html>
