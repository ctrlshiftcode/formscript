<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FormScript consent</title>
    <link rel="stylesheet" href="consent.css">
  </head>
  <body>
    <main>
      <div class="actions">
        <button id="confirm" class="primary" type="button">OK</button>
        <button id="cancel" class="cancel" type="button">Cancel</button>
        <span id="countdown" class="countdown" aria-live="off">10s</span>
      </div>
      <span class="arrival-indicator" aria-hidden="true"></span>
    </main>
    <script src="consent.js"></script>
  </body>
</html>
