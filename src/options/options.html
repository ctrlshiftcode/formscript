<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FormScript - Settings</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <header>
        <img src="../../assets/icons/favico.png" alt="">
        <div>
          <h1>FormScript</h1>
          <p>Settings and local data</p>
        </div>
      </header>

      <section aria-labelledby="preferences-heading">
        <h2 id="preferences-heading">Preferences</h2>
        <label class="setting">
          <input id="ask-before-save" type="checkbox">
          <span>
            <strong>Ask before saving</strong>
            <small>Ask after a new form is submitted.</small>
          </span>
        </label>
        <label class="setting">
          <input id="fill-only-empty" type="checkbox">
          <span>
            <strong>Fill empty fields only</strong>
            <small>Keep values that are already present on the page.</small>
          </span>
        </label>
      </section>

      <section aria-labelledby="backup-heading">
        <h2 id="backup-heading">Back up and restore</h2>
        <p>Backups contain saved forms and preferences. They may include personal data; store the file securely.</p>
        <div class="actions">
          <button id="export-backup" class="primary" type="button">Download backup</button>
          <button id="restore-backup" class="secondary" type="button">Restore backup</button>
          <input id="backup-file" type="file" accept="application/json,.json" hidden>
        </div>
      </section>

      <section aria-labelledby="saved-forms-heading">
        <h2 id="saved-forms-heading">Saved forms</h2>
        <div class="saved-forms-heading">
          <p id="saved-forms-summary">Loading saved forms...</p>
          <button id="delete-all-forms" class="danger" type="button">Delete all</button>
        </div>
        <div id="saved-forms" class="saved-forms"></div>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
